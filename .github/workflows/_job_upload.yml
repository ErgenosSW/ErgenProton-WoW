name: _job_upload

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      name:
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload:
    name: Verify and attach release archives to draft
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.version }}
      ARTIFACT_NAME: ${{ inputs.name }}
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.name }}.tar.gz
          path: assets
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ inputs.name }}.sha512sum
          path: assets
      - name: Verify checksum and preserve published releases
        working-directory: assets
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ARTIFACT_NAME.tar.gz"
          test -s "$ARTIFACT_NAME.sha512sum"
          sha512sum --check --strict "$ARTIFACT_NAME.sha512sum"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" \
            "$ARTIFACT_NAME.tar.gz" "$ARTIFACT_NAME.sha512sum" --clobber
