name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'ErgenProton-WoW-*'
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
    steps:
      - name: Resolve tag and artifact name
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == v* ]]; then
            echo "artifact_name=ErgenProton-WoW-${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/_job_build.yml
    with:
      name: ${{ needs.prepare.outputs.artifact_name }}
      ref: ${{ needs.prepare.outputs.tag }}

  release:
    name: Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ needs.prepare.outputs.tag }}
        fetch-depth: 0
        fetch-tags: true
    - name: Tags
      shell: bash
      run: |
        git fetch origin +refs/tags/*:refs/tags/*
    - name: Create Release
      id: create
      shell: bash
      run: |
        if gh release view "${{ needs.prepare.outputs.tag }}" &>/dev/null; then
          echo "Release ${{ needs.prepare.outputs.tag }} already exists. Skipping creation."
        else
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --latest \
            --title "ErgenProton-WoW ${TAG_VERSION}" \
            --notes-from-tag \
            --verify-tag
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_VERSION: ${{ needs.prepare.outputs.tag }}
        
  upload:
    name: Upload
    needs: [prepare, release]
    uses: ./.github/workflows/_job_upload.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}
      name: ${{ needs.prepare.outputs.artifact_name }}
